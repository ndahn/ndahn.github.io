site_name: Manas Things of Wonder
site_url: https://ndahn.github.io
site_author: Nikolas Dahn
site_description: "The part of me that I care to show others"
copyright: Nikolas Dahn
theme:
  favicon: ""
  logo: assets/images/maris.png
  name: material
  custom_dir: docs/overrides/
  font:
    text: Noto Sans
  features:
    - announce.dismiss
    - content.code.copy
    - header.autohide
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
  palette:
    - scheme: slate
      primary: blue grey
      accent: teal

nav:
  - Home: index.md
  - Software: software.md
  - Stories: stories.md
  - Art: art.md
  - Other: other.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ndahn

exclude_docs: "!/templates/"

plugins:
  - search
  - mkdocs-video

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      toc_depth: "1-3"
      permalink: true
  # Python Markdown Extensions
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg